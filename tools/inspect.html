<!doctype html><html><body style="margin:0;background:#f5f5f5"><canvas id=c width=1800 height=1200></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
const files=['8-panel','8-in-male','8-in-fem','8-pin','8-pin-corner','2.5-in-spacer','4.5-in-spacer','16-in-inner','18-in-inner'];
const r=new THREE.WebGLRenderer({canvas:c,antialias:true});r.setScissorTest(true);
const L=new GLTFLoader();const gl=await Promise.all(files.map(f=>L.loadAsync('/models/'+f+'.glb')));
const view=new URLSearchParams(location.search).get('v')||'iso';
gl.forEach((g,i)=>{const s=new THREE.Scene();s.background=new THREE.Color(0xf5f5f5);
 s.add(new THREE.HemisphereLight(0xffffff,0x888888,2));const d=new THREE.DirectionalLight(0xffffff,2);d.position.set(3,5,4);s.add(d);
 const o=g.scene;const b=new THREE.Box3().setFromObject(o);const sz=b.getSize(new THREE.Vector3()),ct=b.getCenter(new THREE.Vector3());
 o.position.sub(ct);s.add(o);s.add(new THREE.AxesHelper(sz.length()*0.4));
 const cam=new THREE.PerspectiveCamera(30,1.5,0.1,1000);const D=sz.length()*1.9;
 const dir={iso:[1,0.8,1.2],front:[0,0,1],top:[0,1,0.001],side:[1,0,0]}[view];cam.position.set(...dir).normalize().multiplyScalar(D);cam.lookAt(0,0,0);
 const x=(i%3)*600,y=(2-Math.floor(i/3))*400;r.setViewport(x,y,600,400);r.setScissor(x,y,600,400);r.render(s,cam);
 console.log(files[i],sz.toArray().map(v=>v.toFixed(2)).join('x'));});
document.title='done';
</script></body></html>
