<!--
  Source for the Webflow paste (tools/build-webflow.mjs -> dist/webflow/paste.html).
  Layout matches the demo / Figma (AmeriLux Design / Concept 17). Text and buttons are empty *_wrap
  divs: the site's components go in there (their typography comes from the components; the demo look
  for them is in webflow/preview.css, preview only). Thumbnails are Image elements. One class per
  element, no styles on classes (all styling is in the CSS embed). Site variables carry fallbacks.
  The JS only looks at data-amx-* attributes and toggles .is-active (see src/tabs.js).
  __TABS__ is filled from TABS in the build script; __JS_SRC__ with the jsDelivr URL of the cdn/ build.
-->
<section class="three_wrap" data-amx-root>
<wf-embed class="u-embed-css"><style>
.three_wrap {
  --three-ink: var(--_swatch---dark-2, #000);
  --three-line: rgba(0, 0, 0, 0.12);
  --three-font: var(--_typography---font--primary-family, "PP Neue Montreal", Arial, sans-serif);
  --three-mono: var(--_typography---font--secondary-family, "PP Neue Montreal Mono", ui-monospace, monospace);
  --three-ease: cubic-bezier(0.6, 0, 0.2, 1);
  background-color: var(--_swatch---light-2, #f5f5f5);
  color: var(--three-ink);
  font-family: var(--three-font);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  container: three / inline-size;
}
.three_layout { display: flex; height: max(760px, 100svh); }

/* ---- left column: the canvas fills it, copy and arrows sit on top ---- */
.three_main { position: relative; flex: 1; min-width: 0; }
.three_stage { position: absolute; inset: 0; }
.three_header, .three_rule, .three_text_wrap, .three_nav { position: absolute; z-index: 1; }
.three_header {
  left: 64px; top: 99px; width: min(585px, calc(100% - 128px));
  display: flex; flex-direction: column; align-items: flex-start; gap: 16px; pointer-events: none;
}
.three_rule { left: 0; right: 0; top: 267px; border-top: 1px solid var(--three-line); }
.three_text_wrap { left: 64px; top: 291px; width: 350px; pointer-events: none; }

.three_nav { right: 62px; bottom: 67px; display: flex; gap: 7px; }
.three_nav_btn {
  display: grid; place-items: center; width: 46px; height: 66px; padding-top: 20px; cursor: pointer;
  border-radius: 2px; border: 1px solid rgba(0, 0, 0, 0.2); background-color: rgba(0, 0, 0, 0.1);
  -webkit-backdrop-filter: blur(25px); backdrop-filter: blur(25px); transition: background-color 0.2s;
}
.three_nav_btn:hover { background-color: rgba(0, 0, 0, 0.18); }
/* arrows: 6 x 12 triangles, the previous one flipped */
.three_nav_icon { width: 6px; height: 12px; background-color: var(--three-ink); clip-path: polygon(0 0, 100% 50%, 0 100%); }
[data-amx-prev] .three_nav_icon { transform: scaleX(-1); }

/* ---- right panel: accordion, one item open (.is-active, set by the script) ---- */
.three_panel {
  flex: none; width: 371px; overflow-y: auto;
  background-color: var(--_swatch---light-1, #fff); border-left: 1px solid var(--three-line);
}
/* One title per tab: the name row (head) stays; opening slides the thumbnail in above it and the
   text + button in below it */
.three_tab { padding: 0 31.5px; border-top: 1px solid var(--three-line); }
.three_tab:first-child { border-top: 0; }
.three_tab:last-child { border-bottom: 1px solid var(--three-line); }

.three_tab_head {
  display: grid; grid-template-columns: 1fr 12px; column-gap: 24px; align-items: center;
  padding: 24px 0; cursor: pointer;
  transition: padding 0.45s var(--three-ease), opacity 0.2s;
}
.three_tab_head:hover { opacity: 0.6; }
.three_tab_caret {
  width: 12px; height: 6px; background-color: var(--three-ink); clip-path: polygon(0 0, 100% 0, 50% 100%);
  transition: opacity 0.3s;
}

/* top and body animate their height with grid-template-rows 0fr <-> 1fr */
.three_tab_top, .three_tab_body {
  display: grid; grid-template-rows: 0fr; opacity: 0;
  transition: grid-template-rows 0.45s var(--three-ease), opacity 0.3s;
}
.three_tab_top_inner, .three_tab_inner { min-height: 0; overflow: hidden; }
.three_tab_top_inner { display: flex; justify-content: space-between; align-items: flex-start; }
.three_tab_top_inner > * { margin-block: 24px; }
.three_tab:first-child .three_tab_top_inner > * { margin-top: 39px; }

.three_tab.is-active .three_tab_top, .three_tab.is-active .three_tab_body { grid-template-rows: 1fr; opacity: 1; }
.three_tab.is-active .three_tab_head { padding: 0 0 16px; cursor: default; }
.three_tab.is-active .three_tab_head:hover { opacity: 1; }
.three_tab.is-active .three_tab_caret { opacity: 0; }

.three_tab_thumb { width: 102px; height: 102px; border-radius: 2px; object-fit: cover; background-color: #ededeb; }
/* close: a 10 x 10 cross */
.three_tab_close { position: relative; width: 10px; height: 10px; cursor: pointer; }
.three_tab_close::before, .three_tab_close::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 13px; height: 2px;
  background-color: var(--three-ink); transform: translate(-50%, -50%) rotate(45deg);
}
.three_tab_close::after { transform: translate(-50%, -50%) rotate(-45deg); }
.three_tab_actions_wrap { margin-block: 27px; }

@media (prefers-reduced-motion: reduce) {
  .three_tab_head, .three_tab_caret, .three_tab_top, .three_tab_body { transition: none; }
}

/* ---- small screens (not in Figma): stage on top, panel below ---- */
@container three (width < 900px) {
  .three_layout { flex-direction: column; height: auto; }
  .three_main { flex: none; height: 78svh; min-height: 560px; }
  .three_header { left: 20px; top: 40px; width: calc(100% - 40px); }
  .three_rule { top: 180px; }
  .three_text_wrap { left: 20px; top: 200px; width: min(350px, calc(100% - 40px)); }
  .three_nav { right: 20px; bottom: 24px; }
  .three_panel { width: 100%; border-left: 0; border-top: 1px solid var(--three-line); }
}
</style></wf-embed>
<div class="three_layout">
  <div class="three_main">
    <div class="three_stage" data-amx-stage></div>
    <div class="three_header">
      <div class="three_eyebrow_wrap"></div>
      <div class="three_title_wrap"></div>
    </div>
    <div class="three_rule"></div>
    <div class="three_text_wrap"></div>
    <div class="three_nav">
      <div class="three_nav_btn" data-amx-prev aria-label="Previous product"><div class="three_nav_icon"></div></div>
      <div class="three_nav_btn" data-amx-next aria-label="Next product"><div class="three_nav_icon"></div></div>
    </div>
  </div>
  <div class="three_panel">
    <div class="three_tabs">
__TABS__
    </div>
  </div>
</div>
<wf-embed class="u-embed-js"><script type="module" src="__JS_SRC__"></script></wf-embed>
</section>
